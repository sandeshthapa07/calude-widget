<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Claude Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="card">
    <header id="header">
      <span class="logo"><i class="b"></i><i class="w"></i><i class="r"></i></span>
      <span class="name">Claude</span>
      <span id="chips"></span>
      <span id="compact-summary"></span>
      <span class="buttons">
        <button id="btn-compact" title="Compact / full view"></button>
        <button id="btn-hide" title="Hide (use the tray / menu bar icon to bring it back)"></button>
      </span>
    </header>

    <div id="full">
      <section id="limits"></section>
      <section id="usage"></section>
    </div>

    <div id="list">
      <div id="empty">No Claude Code sessions running</div>
      <div id="sessions"></div>
    </div>
    <div id="more">&darr;&nbsp; more sessions below &mdash; scroll</div>
    <div id="notice"></div>
    <div id="footer"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
